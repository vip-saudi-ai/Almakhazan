<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="NAZM">
  <!-- Maskable: the mark stays inside the inner 80% safe area, so a circular
       or squircle mask never clips it. -->
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563FF"/><stop offset="0.55" stop-color="#6366F1"/><stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <mask id="mn"><rect width="96" height="96" fill="#fff"/>
      <path d="M37 63V33l22 30V33" fill="none" stroke="#000" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect width="96" height="96" fill="url(#mg)" mask="url(#mn)"/>
</svg>
