<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="NAZM">
  <title>NAZM</title>
  <!-- Below about 24px the production mark loses its counter. This variant
       carries a heavier N and a tighter radius so it still reads. -->
  <mask id="nazm-n-s">
    <rect width="96" height="96" fill="#fff"/>
    <path d="M32 69V27l32 42V27" fill="none" stroke="#000" stroke-width="13"
          stroke-linecap="round" stroke-linejoin="round"/>
  </mask>
  <rect x="0" y="0" width="96" height="96" rx="22" fill="currentColor" mask="url(#nazm-n-s)"/>
</svg>
