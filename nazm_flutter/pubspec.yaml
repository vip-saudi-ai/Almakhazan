name: nazm
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  crypto: ^3.0.7
  decimal: ^3.2.6
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/catalog/
    - assets/taxonomy/
  # Noto Sans and Noto Sans Arabic (SIL Open Font License 1.1), used by the
  # web preview so no font is fetched from a third-party server; the phones
  # use their system fonts.
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans_400Regular.ttf
        - asset: assets/fonts/NotoSans_500Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans_700Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic_400Regular.ttf
        - asset: assets/fonts/NotoSansArabic_500Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic_700Bold.ttf
          weight: 700
